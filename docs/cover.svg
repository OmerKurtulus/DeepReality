<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif">
<rect width="1600" height="900" fill="#141413"/>
<text x="100" y="248" fill="#8A867C" font-size="13" font-weight="700" letter-spacing="2.6">OPEN SOURCE FORENSIC SYSTEM</text>
<text x="96" y="348" fill="#F0EEE6" font-size="94" font-weight="600" letter-spacing="-2.8">DeepReality</text>
<text x="100" y="396" fill="#B3AEA0" font-size="21">A multi-layer forensic architecture for AI-generated</text>
<text x="100" y="426" fill="#B3AEA0" font-size="21">and manipulated imagery.</text>
<line x1="100" y1="466" x2="820" y2="466" stroke="#3A3733" stroke-width="1"/>
<text x="100" y="510" fill="#B3AEA0" font-size="17">15 independent pins across 6 layers, run as a concurrent dependency graph</text>
<text x="100" y="541" fill="#B3AEA0" font-size="17">Seven analytical paradigms, chosen to fail differently rather than to agree</text>
<text x="100" y="572" fill="#B3AEA0" font-size="17">An LLM adjudication layer that reports which rule decided the verdict,</text>
<text x="100" y="603" fill="#B3AEA0" font-size="17">what contradicted it, and which of its own failure modes apply</text>
<line x1="100" y1="700" x2="820" y2="700" stroke="#3A3733" stroke-width="1"/>
<text x="100" y="758" fill="#F0EEE6" font-size="40" font-weight="600">6</text>
<text x="100" y="782" fill="#8A867C" font-size="12" font-weight="700" letter-spacing="1.8">LAYERS</text>
<text x="282" y="758" fill="#F0EEE6" font-size="40" font-weight="600">15</text>
<text x="282" y="782" fill="#8A867C" font-size="12" font-weight="700" letter-spacing="1.8">PINS</text>
