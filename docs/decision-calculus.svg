<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="dc-a" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4" fill="none" stroke="#141413" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dc-g" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4" fill="none" stroke="#8A867C" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="#F0EEE6"/>

  <text x="60" y="52" fill="#141413" font-size="17" font-weight="600" letter-spacing="-0.2">Decision calculus: R1 to R6</text>
  <text x="60" y="74" fill="#6E6B63" font-size="12.5">Ordered rules, evaluated top to bottom, terminating at the first whose precondition holds. Every verdict reports which rule fired.</text>
  <line x1="60" y1="92" x2="1340" y2="92" stroke="#141413" stroke-width="1"/>

  <!-- spine -->
  <line x1="150" y1="126" x2="150" y2="678" stroke="#141413" stroke-width="1.2"/>

  <!-- ── R1 ─────────────────────────────────────────────────────── -->
  <circle cx="150" cy="150" r="7" fill="#141413"/>
  <text x="176" y="140" fill="#141413" font-size="13" font-weight="700">R1</text>
  <text x="212" y="140" fill="#141413" font-size="12.5">Tier 1 AI provenance present</text>
  <text x="176" y="160" fill="#6E6B63" font-size="11.5">Verdict is taken from the declared source type. `trainedAlgorithmicMedia` yields AI_GENERATED,</text>
  <text x="176" y="176" fill="#6E6B63" font-size="11.5">`compositeWith…` yields DEEPFAKE. PIN-B4's class opinion does not override the declaration.</text>
  <path d="M 1000 150 L 1058 150" stroke="#141413" stroke-width="1.1" fill="none" marker-end="url(#dc-a)"/>
  <rect x="1062" y="132" width="278" height="36" rx="5" fill="#141413"/>
  <text x="1080" y="155" fill="#F0EEE6" font-size="11.5" font-weight="600">AI_GENERATED / DEEPFAKE</text>
  <text x="1324" y="155" text-anchor="end" fill="#B3AEA0" font-size="10.5">0.93–0.98</text>

  <!-- ── R2 ─────────────────────────────────────────────────────── -->
  <circle cx="150" cy="222" r="7" fill="#141413"/>
  <text x="176" y="212" fill="#141413" font-size="13" font-weight="700">R2</text>
  <text x="212" y="212" fill="#141413" font-size="12.5">Tier 1 authentic-capture provenance, no AI indicators</text>
  <text x="176" y="232" fill="#6E6B63" font-size="11.5">A signed camera-capture manifest with no generative action and no edit history.</text>
  <path d="M 1000 222 L 1058 222" stroke="#141413" stroke-width="1.1" fill="none" marker-end="url(#dc-a)"/>
  <rect x="1062" y="204" width="278" height="36" rx="5" fill="#FFFFFF" stroke="#141413" stroke-width="1.2"/>
  <text x="1080" y="227" fill="#141413" font-size="11.5" font-weight="600">AUTHENTIC</text>
  <text x="1324" y="227" text-anchor="end" fill="#6E6B63" font-size="10.5">0.85–0.93</text>

  <!-- ── R3 ─────────────────────────────────────────────────────── -->
  <circle cx="150" cy="300" r="7" fill="#141413"/>
  <text x="176" y="290" fill="#141413" font-size="13" font-weight="700">R3</text>
  <text x="212" y="290" fill="#141413" font-size="12.5">Capture telemetry present, but the detectors report synthesis</text>
  <text x="176" y="310" fill="#6E6B63" font-size="11.5">The conflict case. Diagnosis turns on whether the localisation evidence corroborates the detectors.</text>

  <rect x="220" y="328" width="380" height="62" rx="5" fill="#FFFFFF" stroke="#141413" stroke-width="1.1"/>
  <text x="238" y="350" fill="#141413" font-size="11" font-weight="600">no fused regions · attention off-subject</text>
  <text x="238" y="368" fill="#6E6B63" font-size="10.5">computational-photography false positive</text>
  <text x="238" y="383" fill="#6E6B63" font-size="10.5">Tier 2 prevails; the suspicion is named in the report</text>
  <path d="M 600 359 L 1058 359 L 1058 250" stroke="#141413" stroke-width="1.1" fill="none" marker-end="url(#dc-a)"/>

  <rect x="640" y="328" width="360" height="62" rx="5" fill="#E6E3D8" stroke="#B3AEA0" stroke-width="1.1"/>
  <text x="658" y="350" fill="#141413" font-size="11" font-weight="600">fused regions · attention on subject</text>
  <text x="658" y="368" fill="#6E6B63" font-size="10.5">the manipulation hypothesis survives</text>
  <text x="658" y="383" fill="#6E6B63" font-size="10.5">DEEPFAKE at moderate confidence</text>

  <!-- ── R4 ─────────────────────────────────────────────────────── -->
  <circle cx="150" cy="440" r="7" fill="#141413"/>
  <text x="176" y="430" fill="#141413" font-size="13" font-weight="700">R4</text>
  <text x="212" y="430" fill="#141413" font-size="12.5">No Tier 1 or Tier 2 evidence, detector spread ≤ 0.40</text>
  <text x="176" y="450" fill="#6E6B63" font-size="11.5">Decide on Tier 3 consensus, qualified by Tier 4. Only here does PIN-B4's class</text>
  <text x="176" y="466" fill="#6E6B63" font-size="11.5">distribution choose between AI_GENERATED and DEEPFAKE.</text>
  <path d="M 1000 440 L 1058 440" stroke="#141413" stroke-width="1.1" fill="none" marker-end="url(#dc-a)"/>
  <rect x="1062" y="422" width="278" height="36" rx="5" fill="#FFFFFF" stroke="#141413" stroke-width="1.2"/>
  <text x="1080" y="445" fill="#141413" font-size="11.5" font-weight="600">consensus decides</text>

  <!-- ── R5 ─────────────────────────────────────────────────────── -->
  <circle cx="150" cy="512" r="7" fill="#141413"/>
  <text x="176" y="502" fill="#141413" font-size="13" font-weight="700">R5</text>
  <text x="212" y="502" fill="#141413" font-size="12.5">Detector spread &gt; 0.40, no provenance</text>
  <text x="176" y="522" fill="#6E6B63" font-size="11.5">Wide dispersion means at least one instrument is outside its validated domain. The system</text>
  <text x="176" y="538" fill="#6E6B63" font-size="11.5">reports that rather than concealing it behind an average, and names the disagreeing detectors.</text>
  <path d="M 1000 512 L 1058 512" stroke="#141413" stroke-width="1.1" fill="none" marker-end="url(#dc-a)"/>
  <rect x="1062" y="494" width="278" height="36" rx="5" fill="#FFFFFF" stroke="#141413" stroke-width="1.2"/>
  <text x="1080" y="517" fill="#141413" font-size="11.5" font-weight="600">SUSPICIOUS</text>
  <text x="1324" y="517" text-anchor="end" fill="#6E6B63" font-size="10.5">≤ 0.60</text>

  <!-- ── R6 ─────────────────────────────────────────────────────── -->
  <circle cx="150" cy="590" r="7" fill="#141413"/>
  <text x="176" y="580" fill="#141413" font-size="13" font-weight="700">R6</text>
  <text x="212" y="580" fill="#141413" font-size="12.5">Evidence insufficient or irreconcilable</text>
  <text x="176" y="600" fill="#6E6B63" font-size="11.5">Selecting this honestly is correct behaviour, not failure.</text>
  <path d="M 1000 590 L 1058 590" stroke="#141413" stroke-width="1.1" fill="none" marker-end="url(#dc-a)"/>
  <rect x="1062" y="572" width="278" height="36" rx="5" fill="#E6E3D8" stroke="#B3AEA0" stroke-width="1.2"/>
  <text x="1080" y="595" fill="#57544C" font-size="11.5" font-weight="600">INCONCLUSIVE</text>

  <!-- ── Why ordered ────────────────────────────────────────────── -->
  <line x1="60" y1="654" x2="1340" y2="654" stroke="#B3AEA0" stroke-width="1"/>
  <text x="60" y="680" fill="#141413" font-size="11.5" font-weight="600">Why ordering rather than weighting</text>
  <text x="60" y="700" fill="#6E6B63" font-size="11.5">A weighted scheme has no way to express "this evidence class cannot be outvoted". Any finite weight placed on documentary provenance</text>
  <text x="60" y="716" fill="#6E6B63" font-size="11.5">can be overcome by enough correlated detector agreement, and because PIN-B1 through B3 share a training corpus, such agreement is</text>
  <text x="60" y="732" fill="#6E6B63" font-size="11.5">precisely what the system produces most readily under distribution shift. Ordered rules make the constraint structural, not parametric.</text>
</svg>
