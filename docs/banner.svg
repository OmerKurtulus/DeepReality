<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 340" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#141413" stroke-width="0.4" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1600" height="340" fill="#F0EEE6"/>
  <rect width="1600" height="340" fill="url(#grid)"/>

  <!-- contact strip, echoing the pin-array metaphor -->
  <g fill="#141413" opacity="0.20">
    <rect x="96" y="52" width="7" height="7" rx="1.5"/><rect x="124" y="52" width="7" height="7" rx="1.5"/>
    <rect x="152" y="52" width="7" height="7" rx="1.5"/><rect x="180" y="52" width="7" height="7" rx="1.5"/>
    <rect x="208" y="52" width="7" height="7" rx="1.5"/><rect x="236" y="52" width="7" height="7" rx="1.5"/>
    <rect x="264" y="52" width="7" height="7" rx="1.5"/><rect x="292" y="52" width="7" height="7" rx="1.5"/>
    <rect x="320" y="52" width="7" height="7" rx="1.5"/><rect x="348" y="52" width="7" height="7" rx="1.5"/>
    <rect x="376" y="52" width="7" height="7" rx="1.5"/><rect x="404" y="52" width="7" height="7" rx="1.5"/>
  </g>
  <g fill="#141413">
    <rect x="432" y="52" width="7" height="7" rx="1.5"/><rect x="460" y="52" width="7" height="7" rx="1.5"/>
    <rect x="488" y="52" width="7" height="7" rx="1.5"/>
  </g>

  <text x="96" y="150" fill="#141413" font-size="72" font-weight="600" letter-spacing="-2.2">DeepReality</text>
  <line x1="96" y1="182" x2="1504" y2="182" stroke="#141413" stroke-width="1.2"/>
  <text x="96" y="216" fill="#141413" font-size="19" letter-spacing="-0.1">A multi-layer forensic architecture for detecting AI-generated and manipulated imagery</text>
  <text x="96" y="248" fill="#6E6B63" font-size="14.5">Fifteen independent analysis pins · concurrent execution · documentary provenance outranks statistical inference</text>

  <!-- layer ticks -->
  <g font-size="11.5" letter-spacing="1.3" font-weight="600">
    <text x="96"  y="296" fill="#141413">L1 PREPROCESSING</text>
    <text x="306" y="296" fill="#141413">L2 DETECTION CORE</text>
    <text x="530" y="296" fill="#A9A498">L3 TEMPORAL</text>
    <text x="690" y="296" fill="#141413">L4 EXPLAINABILITY</text>
    <text x="908" y="296" fill="#141413">L5 ADJUDICATION</text>
    <text x="1112" y="296" fill="#141413">L6 ENSEMBLE FUSION</text>
  </g>
  <g stroke-width="2.5" stroke-linecap="square">
    <line x1="96"   y1="310" x2="270"  y2="310" stroke="#141413"/>
    <line x1="306"  y1="310" x2="494"  y2="310" stroke="#141413"/>
    <line x1="530"  y1="310" x2="654"  y2="310" stroke="#C9C5B8" stroke-dasharray="5 4"/>
    <line x1="690"  y1="310" x2="872"  y2="310" stroke="#141413"/>
    <line x1="908"  y1="310" x2="1076" y2="310" stroke="#141413"/>
    <line x1="1112" y1="310" x2="1300" y2="310" stroke="#141413"/>
  </g>

  <text x="1504" y="150" text-anchor="end" fill="#141413" font-size="13" font-weight="600" letter-spacing="1.5">PIN ARCHITECTURE</text>
  <text x="1504" y="296" text-anchor="end" fill="#8A867C" font-size="11.5">Ömer Faruk Kurtuluş</text>
</svg>
